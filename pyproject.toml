[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nsa_flow"
version = "2.8.0"
description = "Non-negative Stiefel-Approximating Flow for interpretable representation learning"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "B. Avants" }]
dependencies = ["torch>=2.0"]

[project.optional-dependencies]
experiments = ["numpy>=1.23", "pandas>=1.5", "scikit-learn>=1.3", "matplotlib>=3.7"]
test = ["pytest>=7.0", "numpy>=1.23"]

[project.urls]
Homepage = "https://github.com/stnava/nsa_flow"
Repository = "https://github.com/stnava/nsa_flow"

[tool.setuptools.packages.find]
include = ["nsa_flow*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
